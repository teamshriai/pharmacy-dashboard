# SHRI HEALTH Pharmacy Console at https://www.shri-ai.org/dev/pharmacy/
#
# Include this file INSIDE the existing `server { listen 443 ssl; server_name www.shri-ai.org; ... }`
# block (the one certbot manages), for example:
#
#     include /etc/nginx/snippets/dev-pharmacy.conf;
#
# Files live in /var/www/shri-ai/dev/pharmacy/ (a symlink to the current release;
# see DEPLOY.md). Test with `sudo nginx -t` before `sudo systemctl reload nginx`.

# /dev/pharmacy -> /dev/pharmacy/ so relative asset paths resolve.
location = /dev/pharmacy {
    return 301 /dev/pharmacy/;
}

# "Order more" talks to the Procurement Centre through this path. Until that
# service is deployed, answer with JSON so the console shows a clear message
# instead of trying to read the app's own HTML.
location ^~ /dev/pharmacy/procurement-api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"Procurement Centre is not connected yet"}';

    # When the Procurement Centre is running, replace the three lines above with
    # (note the trailing slashes: /dev/pharmacy/procurement-api/x -> /api/x):
    #
    # proxy_pass         http://PROCUREMENT_HOST:4000/api/;
    # proxy_http_version 1.1;
    # proxy_set_header   Host              $host;
    # proxy_set_header   X-Real-IP         $remote_addr;
    # proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # proxy_set_header   X-Forwarded-Proto $scheme;
    # proxy_connect_timeout 5s;
    # proxy_read_timeout    30s;
}

location ^~ /dev/pharmacy/ {
    root  /var/www/shri-ai;
    index index.html;
    # Routing is hash-based (#/stock), so real paths are only files; anything
    # else falls back to the app.
    try_files $uri $uri/ /dev/pharmacy/index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # add_header is not inherited by nested locations, so the security headers
    # are repeated in each one below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # The page itself must always be revalidated so a new release is picked up.
    add_header Cache-Control "no-cache" always;

    # Hashed build output (index-AbC123.js …): the name changes whenever the
    # content does, so browsers can keep it for a year.
    location ^~ /dev/pharmacy/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
}
