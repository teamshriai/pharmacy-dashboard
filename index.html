<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Order medicines, upload prescriptions, track deliveries and manage refills." />
    <title>SHRI-AI Pharmacy</title>
    <script>
      // Apply the saved theme before first paint so there is no flash; night is the default.
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('shri-pharmacy-theme') === 'light' ? 'light' : 'dark'
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
